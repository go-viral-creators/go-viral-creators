<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #03050a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="s1" class="clip" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="4.2" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:1"></div>
      <div id="s2" class="clip" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="3.9" data-duration="5.4" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:2"></div>
      <div id="s3" class="clip" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="9.24" data-duration="4.36" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:3"></div>
      <div id="s4" class="clip" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="13.54" data-duration="4.01" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:4"></div>
      <div id="s5" class="clip" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="17.49" data-duration="4.86" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:5"></div>
      <div id="s6" class="clip" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="22.29" data-duration="5.31" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:6"></div>
      <div id="s7" class="clip" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="26.7" data-duration="3.3" data-track-index="1" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:7"></div>
      <div id="fx" class="clip" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="30" data-track-index="2" data-width="1920" data-height="1080" data-track-kind="graphics" style="z-index:100"></div>
      <audio id="song" class="clip" src="assets/song.mp3" data-start="0" data-duration="30" data-media-start="16.95" data-volume="1" data-fade-in="0.35" data-fade-out="0.7" data-track-index="5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
