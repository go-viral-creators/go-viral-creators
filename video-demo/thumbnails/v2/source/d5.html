<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.sky { position:absolute; inset:0; background: radial-gradient(ellipse 80% 70% at 70% 30%, #1c2f5e 0%, #0a1430 50%, #03060f 100%); }
.clouds { position:absolute; inset:0; width:100%; height:100%; opacity:.75; }
.ghost { height: 560px; left: 40px; top: -40px; opacity:.32; mix-blend-mode: screen; filter: grayscale(.6) brightness(1.3) hue-rotate(190deg); -webkit-mask-image: radial-gradient(ellipse 55% 60% at 55% 45%, #000 40%, transparent 100%); }
svg.bolt { position:absolute; inset:0; }
.flash { position:absolute; inset:0; background: radial-gradient(ellipse 30% 40% at 78% 18%, rgba(200,225,255,.55), transparent 70%); mix-blend-mode: screen; }
.road { position:absolute; left:0; right:0; bottom:0; height: 200px; background: linear-gradient(180deg, rgba(10,20,40,0), #050a16 70%); }
.trail { height: 690px; right: 250px; bottom: -10px; opacity:.25; filter: blur(6px) brightness(1.6) hue-rotate(200deg); }
.trail2 { height: 690px; right: 300px; bottom: -10px; opacity:.12; filter: blur(10px) brightness(1.8); }
.boy { height: 700px; right: 190px; bottom: -20px; filter: drop-shadow(0 0 22px rgba(150,200,255,.8)); }
.rain { position:absolute; inset:0; background: repeating-linear-gradient(100deg, transparent 0 18px, rgba(210,230,255,.12) 18px 19px); }
.title { left: 34px; top: 420px; font-size: 140px; color:#eaf4ff; text-shadow: 0 0 2px #000, 0 6px 0 #04102a, 0 0 18px #7fbaff, 0 0 46px #3f8cff, 0 0 90px #2a6dff; }
.singer { left: 42px; top: 568px; font-size: 44px; color:#fff; text-shadow: 0 3px 0 #000, 0 0 16px rgba(110,170,255,.95); }
</style></head><body><div class="stage">
<div class="sky"></div><img class="clouds" src="img/clouds_storm.png"><img class="cut ghost" src="img/girl_smile.png"><div class="flash"></div>
<svg class="bolt" viewBox="0 0 1280 720"><defs><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<polyline filter="url(#b)" points="1010,0 975,95 1012,110 955,240 990,250 930,380" fill="none" stroke="#e8f2ff" stroke-width="5"/>
<polyline filter="url(#b)" points="990,250 1040,320 1020,330 1070,420" fill="none" stroke="#cfe2ff" stroke-width="3"/>
<polyline filter="url(#b)" points="975,95 900,150 915,165 860,230" fill="none" stroke="#cfe2ff" stroke-width="2.5"/></svg>
<div class="road"></div>
<img class="cut trail2" src="img/boy_run.png"><img class="cut trail" src="img/boy_run.png"><img class="cut boy" src="img/boy_run.png">
<div class="rain"></div>
<div class="a title">तेरा इंतज़ार है</div><div class="a singer">BAD DEVIL</div>
<div class="grain"></div></div></body></html>
