<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.sky { position:absolute; inset:0; background: linear-gradient(180deg,#2b1446 0%,#7a2c5c 35%,#e0664a 62%,#ffb35a 80%,#ffd98a 100%); }
.sun { position:absolute; left: 820px; top: 380px; width: 700px; height: 700px; margin:-350px; background: radial-gradient(circle, #fff6d8 0%, #ffd27a 12%, rgba(255,150,60,.55) 28%, transparent 62%); }
.clouds { position:absolute; inset:0; width:100%; height:100%; opacity:.55; mix-blend-mode: screen; }
.field { position:absolute; left:0; right:0; bottom:0; height: 150px; background: linear-gradient(180deg, rgba(120,50,20,0), #3a1408 70%); }
.couple { height: 660px; right: 60px; bottom: 0;  -webkit-mask-image: linear-gradient(to bottom,#000 84%,transparent 100%); }
.w-couple { position:absolute; inset:0; filter: drop-shadow(0 0 40px rgba(255,190,110,.65)); }
.petal { position:absolute; width: 14px; height: 9px; border-radius: 60% 40% 60% 40%; background: #ffd0c0; opacity:.85; box-shadow: 0 0 8px rgba(255,200,180,.8); }
.title { left: 40px; top: 70px; font-size: 136px; color:#fff;
  text-shadow: 0 0 2px #5a1a00, 0 4px 0 #8a2a00, 0 8px 0 #4a1400, 0 0 40px rgba(255,200,100,.9); }
.under { position:absolute; left: 44px; top: 222px; width: 560px; height: 8px; border-radius: 4px; background: linear-gradient(90deg,#fff3c4,#ffb340,rgba(255,180,60,0)); box-shadow: 0 0 18px rgba(255,190,90,.9); }
.singer { left: 48px; top: 250px; font-size: 46px; color:#fff; text-shadow: 0 3px 0 #6a1f00, 0 0 16px rgba(255,170,80,.9); }
</style></head><body><div class="stage">
<div class="sky"></div><img class="clouds" src="img/clouds_warm.png"><div class="sun"></div><div class="field"></div>
<div class="w-couple"><img class="cut couple" src="img/couple_dupatta.png"></div>
<div class="petal" style="left:520px;top:300px;transform:rotate(30deg)"></div><div class="petal" style="left:600px;top:460px;transform:rotate(-20deg)"></div>
<div class="petal" style="left:420px;top:540px;transform:rotate(60deg)"></div><div class="petal" style="left:1180px;top:120px;transform:rotate(10deg)"></div>
<div class="petal" style="left:700px;top:180px;transform:rotate(-45deg)"></div><div class="petal" style="left:330px;top:420px;transform:rotate(15deg)"></div>
<div class="a title">तेरा इंतज़ार है</div><div class="under"></div><div class="a singer">BAD DEVIL</div>
<div class="grain"></div></div></body></html>
