<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.sky { position:absolute; inset:0; background: linear-gradient(180deg,#02040e 0%,#0a1638 55%,#1a2e5c 80%,#0a1020 100%); }
.moon { width: 400px; right: 90px; top: 50px; filter: drop-shadow(0 0 60px rgba(200,220,255,.75)) drop-shadow(0 0 160px rgba(140,180,255,.5)); }
.halo { position:absolute; right: -60px; top:-90px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(170,200,255,.28), transparent 62%); }
.ghost { height: 700px; left: -60px; top: -20px; opacity: .42; mix-blend-mode: screen; filter: saturate(.6) brightness(1.15); -webkit-mask-image: radial-gradient(ellipse 60% 65% at 55% 45%, #000 45%, transparent 100%); }
.city { position:absolute; left:0; right:0; bottom: 128px; height: 90px; opacity:.9; }
.ground { position:absolute; left:0; right:0; bottom:0; height: 150px; background: linear-gradient(180deg,rgba(30,50,100,.0),#0a142c 30%,#03060e); }
.mist { position:absolute; left:0; right:0; bottom: 110px; height: 90px; background: linear-gradient(180deg,transparent, rgba(150,180,240,.18), transparent); }
.refl { position:absolute; right: 260px; bottom: 0; width: 320px; height: 130px; background: radial-gradient(ellipse 50% 40% at 50% 10%, rgba(200,220,255,.35), transparent 70%); }
.boy { height: 300px; right: 250px; bottom: 98px; filter: drop-shadow(0 0 18px rgba(170,200,255,.6)); }
.rain { position:absolute; inset:0; background: repeating-linear-gradient(103deg, rgba(200,220,255,.0) 0 22px, rgba(200,220,255,.10) 22px 23px); }
.title { left: 46px; top: 360px; font-size: 140px; color:#f4f8ff; text-shadow: 0 0 2px #000, 0 6px 0 #0a1638, 0 0 30px rgba(140,190,255,.95), 0 0 80px rgba(90,150,255,.6); }
.hl { position:absolute; left: 30px; top: 410px; width: 860px; height: 110px; background: linear-gradient(90deg, rgba(40,90,220,.55), rgba(40,90,220,0)); transform: skewX(-12deg); }
.singer { left: 54px; top: 528px; font-size: 42px; color:#bcd6ff; text-shadow: 0 3px 0 #000, 0 0 16px rgba(100,160,255,.7); }
</style></head><body><div class="stage">
<div class="sky"></div><div class="halo"></div><img class="cut moon" src="img/moon.png">
<img class="cut ghost" src="img/girl_smile.png">
<div class="ground"></div><div class="mist"></div><div class="refl"></div>
<img class="cut boy" src="img/boy_kneel.png">
<div class="rain"></div>

<div class="a title">तेरा इंतज़ार है</div><div class="a singer">BAD DEVIL</div>
<div class="grain"></div></div></body></html>
